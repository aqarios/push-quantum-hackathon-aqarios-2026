[project]
name = "push-quantum-hackathon-2026"
version = "0.1.0"
description = "PushQuantum Hackathon 2026: build gate-based quantum optimization algorithms and benchmark them with luna_model, luna_quantum and luna_bench."
requires-python = ">=3.13"
dependencies = [
    "luna-model>=0.7.5",
    "luna-quantum>=1.3",
    "luna-bench>=0.2.1",
    "luna-usecases>=0.2.0",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
    "scipy>=1.14",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "scipy-stubs~=1.18.1",
]

# The project is installed into the venv (editable) so that `hackathon` and `bench` are importable from
# everywhere, in particular from luna_bench's background worker process, which unpickles the
# algorithm objects by module path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackathon", "bench"]

# Every team adds its packages to its own group: uv add --group <team> <package>. uv sync and uv run install all
# groups, so the merged project has every team's packages.
[tool.uv]
default-groups = "all"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["bench/tests"]
